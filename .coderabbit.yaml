# CodeRabbit settings for install.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# the README as code guidelines. Only what is specific to this repository is here.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "install.sh"
      instructions: |
        Run as root through `curl … | sudo bash -s <name>`. Before running anything it checks the release
        archive's SHA-256 and that every path in it is inside its single top folder; flag any weakening. A token
        goes only to api.github.com (never to the storage redirect), never on a command line or in output, and
        is passed on in INSTALL_GITHUB_TOKEN only. Public products never ask for one. The PRODUCTS list
        (name|repository|private) must match the README table. INSTALL_TEST_* variables are test-only.
    - path: "test/**"
      instructions: |
        Tests run the real install.sh against test/fake_github.py: every change to install.sh needs a case here,
        including the failure paths (nothing may run after a refused archive).
